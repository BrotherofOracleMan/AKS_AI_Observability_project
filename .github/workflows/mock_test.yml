# Reusable mock-test workflow (called by ai_on_kubernetes_pipeline.yml).
# Dummy env so Config/openai_client can import without real Azure secrets.
name: Mock Test

env:
  BASE_URL: http://localhost:8000
  AZURE_OPENAI_ENDPOINT: https://example.invalid
  AZURE_OPENAI_API_KEY: dummy
  AZURE_OPENAI_MODEL: dummy-model
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run mock tests
        run: uv run pytest tests/test_mock.py -v
