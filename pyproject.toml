[project]
name = "ai-on-kubernetes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.2",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "pytest-mock>=3.15.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real Azure and needs secrets"
]