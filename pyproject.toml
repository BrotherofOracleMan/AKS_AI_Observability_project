[project]
name = "ai-on-kubernetes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.2",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
