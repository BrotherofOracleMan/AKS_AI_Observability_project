# WHAT: Env vars for Azure OpenAI (like .env, but stored in the cluster).
# SETUP: cp secret.example.yaml secret.yaml → paste values from .env

apiVersion: v1
kind: Secret
metadata:
  name: azure-openai
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: "FILL_IN"
  AZURE_OPENAI_API_KEY: "FILL_IN"
  AZURE_OPENAI_MODEL: "FILL_IN"
  AZURE_OPENAI_API_VERSION: "FILL_IN"
