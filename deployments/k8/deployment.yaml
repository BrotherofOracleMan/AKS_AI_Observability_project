# WHAT: Run your app as a pod in the cluster.
# KEY IDEA: replicas=1 means one copy. labels must match service.yaml.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-on-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-on-kubernetes
  template:
    metadata:
      labels:
        app: ai-on-kubernetes
    spec:
      containers:
        - name: proxy
          image: ai-on-kubernetes:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: azure-openai
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
