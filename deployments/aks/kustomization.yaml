namespace: ai-proxy-ns

resources:
  - ../k8
  - namespace.yaml

images:
    - name: ai-on-kubernetes
      newName: <REGISTRY>/ai-on-kubernetes
      newTag: v1

patches:
  - target:
      kind: Deployment
      name: ai-on-kubernetes
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/metadata/labels/azure.workload.identity~1use
        value: "true"
  - target:
      kind: ServiceAccount
      name: ai-proxy
    patch: |-
      - op: add
        path: /metadata/annotations
        value: 
          azure.workload.identity/client-id: <CLIENT_ID>