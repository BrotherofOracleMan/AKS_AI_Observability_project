resources:
  - ../k8

images:
    - name: ai-on-kubernetes
      newName: <REGISTRY>/ai-on-kubernetes
      newTag: v1

patches:
  - target:
      kind: Deployment
      name: ai-on-kubernetes
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent